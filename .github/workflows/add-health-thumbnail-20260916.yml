name: Add Health Education thumbnail
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: "!contains(github.event.head_commit.message, '[health-thumb-update]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add thumbnail and update card
        env:
          IMG_B64: "" 
        run: |
          echo "$IMG_B64" | base64 -d > assets/health-thumb.webp
          python - <<'PY'
          p='index.html'
          s=open(p,encoding='utf-8').read()
          old='<div class="thumb"><div class="thumbTitle">HEALTH · EDUCATION</div></div>'
          new='<div class="thumb"><img src="assets/health-thumb.webp" alt="Health Education thumbnail"><div class="thumbTitle">HEALTH · EDUCATION</div></div>'
          if old not in s: raise SystemExit('Health Education card target not found')
          open(p,'w',encoding='utf-8').write(s.replace(old,new,1))
          PY
          rm -f .github/workflows/add-health-thumbnail-20260916.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/health-thumb.webp .github/workflows/add-health-thumbnail-20260916.yml
          git commit -m "[health-thumb-update] Add Health Education portfolio thumbnail"
          git push
