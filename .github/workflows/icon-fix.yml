name: Fix app icons
on:
  push:
    paths:
      - '.github/workflows/icon-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace broken icons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('https://play.google.com/store/apps/details?id=com.niksoftware.snapseed','https://play-lh.googleusercontent.com/w7o-_yhpqhfsGMrrdYYhgAA7LxiX8yAO-CG_6FGEraUDKGGlXDEDNf_RFtr5f7OJxLVa3dRcPf4WRl8k8ez7%3Dw240-h480')
          ig='https://play-lh.googleusercontent.com/yHi59jmO_lVamcyJ1i3rM1_E8bAiAspShnGjjURq05ipQQSUksO3QVEsXTegRSqul038-4YNA7O644XAcx251Q%3Dw240-h480'
          be='https://play-lh.googleusercontent.com/TWXbMMrPAPyf-MJIrj1tFfLAozOv0tLSmt6oApKd9et0MfspEaE-Qzu3Dss-w4zOZ0Wg6GWf_TIjIGjabJYRew%3Dw240-h480'
          li='https://play-lh.googleusercontent.com/oij55bxj3e-4JrhGntpki0lnQyE8yQn8X5FPEzZ0t7cLppeiSINynEk7n9COoh7QSaCOZ_yiPO31NVaW4SDbWg%3Dw240-h480'
          s=re.sub(r'<a class="instagram"([^>]*)><svg\b.*?</svg></a>', lambda m:'<a class="instagram"'+m.group(1)+'><img src="'+ig+'" alt="Instagram"></a>', s, flags=re.S)
          s=re.sub(r'<a class="behance"([^>]*)><svg\b.*?</svg></a>', lambda m:'<a class="behance"'+m.group(1)+'><img src="'+be+'" alt="Behance"></a>', s, flags=re.S)
          s=re.sub(r'<a class="linkedin"([^>]*)><svg\b.*?</svg></a>', lambda m:'<a class="linkedin"'+m.group(1)+'><img src="'+li+'" alt="LinkedIn"></a>', s, flags=re.S)
          s=s.replace('.contact svg{width:44px;height:44px;display:block}', '.contact svg,.contact img{width:44px;height:44px;display:block;object-fit:contain}')
          s=s.replace('.contact .instagram svg{width:46px;height:46px}', '.contact .instagram svg,.contact .instagram img{width:46px;height:46px}')
          s=s.replace('.contact .behance svg{width:46px;height:46px}', '.contact .behance svg,.contact .behance img{width:46px;height:46px}')
          s=s.replace('.contact .linkedin svg{width:46px;height:46px}', '.contact .linkedin svg,.contact .linkedin img{width:46px;height:46px}')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix Play Store app icons' || exit 0
          git push
      - name: Remove workflow
        if: always()
        run: |
          rm -f .github/workflows/icon-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary icon fix workflow' || exit 0
          git push
