name: Reorder portfolio
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move Emirati Women's Day to top
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='<a class="card reveal" href="https://www.behance.net/gallery/255802085/Emirati-Womens-Day"'
          start=s.find(marker)
          if start == -1:
              raise SystemExit('Emirati Women\'s Day card not found')
          end=s.find('</a>', start)+4
          card=s[start:end]
          s=s[:start]+s[end:]
          grid=s.find('<div class="grid">')
          insert=s.find('>', grid)+1
          s=s[:insert]+card+s[insert:]
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Move Emirati Women's Day to top of selected work" || true
          rm .github/workflows/reorder-emirati.yml
          git add .github/workflows/reorder-emirati.yml
          git commit -m "Remove one-time reorder workflow" || true
          git push
