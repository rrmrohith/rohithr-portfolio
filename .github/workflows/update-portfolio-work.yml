name: Update selected portfolio work
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update portfolio cards
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='''<div class="grid"><a class="card reveal" href="https://www.behance.net/gallery/255355855/Work-for-Encoder-(UAE)" target="_blank" rel="noopener"><div class="thumb"><img src="assets/encoder-thumb.webp" alt="Work for Encoder thumbnail"><div class="thumbTitle">ENCODER · UAE</div></div><div class="play">▶</div><div class="ci"><div class="tag">UAE · Social Content</div><h3>Work for Encoder (UAE)</h3><p>Video editing and social-first creative work.</p><div class="watch">VIEW ON BEHANCE ↗</div></div></a><a class="card reveal delay1" href="https://www.behance.net/gallery/255149163/Some-glimpses" target="_blank" rel="noopener"><div class="thumb"><img src="assets/some-glimpses-thumb.webp" alt="Some Glimpses thumbnail"><div class="thumbTitle">CINEMATIC · SHORT-FORM</div></div><div class="play">▶</div><div class="ci"><div class="tag">Short-form · Editing</div><h3>Some Glimpses</h3><p>Short-form edits with a cinematic visual approach.</p><div class="watch">VIEW ON BEHANCE ↗</div></div></a><a class="card reveal delay2" href="https://www.behance.net/gallery/253985009/Color-Grading" target="_blank" rel="noopener"><div class="thumb"><img src="assets/color-grading-thumb.webp" alt="Color Grading thumbnail"><div class="thumbTitle">COLOR · POST</div></div><div class="play">▶</div><div class="ci"><div class="tag">Color · Post-production</div><h3>Color Grading</h3><p>Visual finishing, mood and tone for video.</p><div class="watch">VIEW ON BEHANCE ↗</div></div></a><a class="card reveal delay3" href="https://www.behance.net/gallery/253984789/Varanasi-Speed-ramp" target="_blank" rel="noopener"><div class="thumb"><img src="assets/varanasi-thumb.webp" alt="Varanasi Speed Ramp thumbnail"><div class="thumbTitle">VARANASI · SPEED RAMP</div></div><div class="play">▶</div><div class="ci"><div class="tag">Speed Ramp · Editing</div><h3>Varanasi Speed Ramp</h3><p>Fast-paced visual storytelling with speed-ramp editing.</p><div class="watch">VIEW ON BEHANCE ↗</div></div></a><div class="more reveal"><div><strong>More work on Behance</strong><br><span>Explore the complete project collection, including additional edits, photography and creative experiments.</span></div><a class="moreBtn" href="https://www.behance.net/rohiiit" target="_blank">VIEW ALL BEHANCE WORK ↗</a></div></div>'''
          new='''<div class="grid"><a class="card reveal" href="https://www.behance.net/gallery/255355855/Work-for-Encoder-(UAE)" target="_blank" rel="noopener"><div class="thumb"><img src="assets/encoder-thumb.webp" alt="Work for Encoder thumbnail"><div class="thumbTitle">ENCODER · UAE</div></div><div class="play">▶</div><div class="ci"><div class="tag">UAE · Social Content</div><h3>Work for Encoder (UAE)</h3><p>Video editing and social-first creative work.</p><div class="watch">VIEW ON BEHANCE ↗</div></div></a><a class="card reveal delay1" href="https://www.behance.net/gallery/255149163/Some-glimpses" target="_blank" rel="noopener"><div class="thumb"><img src="assets/some-glimpses-thumb.webp" alt="Some Glimpses thumbnail"><div class="thumbTitle">CINEMATIC · SHORT-FORM</div></div><div class="play">▶</div><div class="ci"><div class="tag">Short-form · Editing</div><h3>Some Glimpses</h3><p>Short-form edits with a cinematic visual approach.</p><div class="watch">VIEW ON BEHANCE ↗</div></div></a><a class="card reveal delay2" href="https://www.behance.net/gallery/253985009/Color-Grading" target="_blank" rel="noopener"><div class="thumb"><img src="assets/color-grading-thumb.webp" alt="Color Grading thumbnail"><div class="thumbTitle">COLOR · POST</div></div><div class="play">▶</div><div class="ci"><div class="tag">Color · Post-production</div><h3>Color Grading</h3><p>Visual finishing, mood and tone for video.</p><div class="watch">VIEW ON BEHANCE ↗</div></div></a><a class="card reveal delay3" href="https://www.behance.net/gallery/255801891/Health-Education" target="_blank" rel="noopener"><div class="thumb"><div class="thumbTitle">HEALTH · EDUCATION</div></div><div class="play">▶</div><div class="ci"><div class="tag">Medical · Educational</div><h3>Health Education</h3><p>Clear, engaging video content for health and education.</p><div class="watch">VIEW ON BEHANCE ↗</div></div></a><a class="card reveal" href="https://www.behance.net/gallery/255802085/Emirati-Womens-Day" target="_blank" rel="noopener"><div class="thumb"><div class="thumbTitle">UAE · WOMEN'S DAY</div></div><div class="play">▶</div><div class="ci"><div class="tag">UAE · Social Content</div><h3>Emirati Women's Day</h3><p>Social-first creative content celebrating Emirati Women's Day.</p><div class="watch">VIEW ON BEHANCE ↗</div></div></a><a class="card reveal delay1" href="https://www.behance.net/gallery/255801765/Neuro" target="_blank" rel="noopener"><div class="thumb"><div class="thumbTitle">NEURO · HEALTH</div></div><div class="play">▶</div><div class="ci"><div class="tag">Medical · Content</div><h3>Neuro</h3><p>Professional visual content for a healthcare-focused project.</p><div class="watch">VIEW ON BEHANCE ↗</div></div></a><div class="more reveal"><div><strong>More work on Behance</strong><br><span>Explore the complete project collection, including additional edits, photography and creative experiments.</span></div><a class="moreBtn" href="https://www.behance.net/rohiiit" target="_blank">VIEW ALL BEHANCE WORK ↗</a></div></div>'''
          if old not in s:
              raise SystemExit('Expected portfolio work block not found')
          s=s.replace(old,new,1)
          css_old='.card:nth-child(4) .thumb{background:radial-gradient(circle at 70% 18%,#e6c995bb 0,transparent 27%),radial-gradient(circle at 25% 72%,#9a6848cc 0,transparent 40%),linear-gradient(135deg,#352b25,#8d765c 52%,#171514)}'
          css_new=css_old+'.card:nth-child(5) .thumb{background:radial-gradient(circle at 75% 20%,#6cc3b4aa 0,transparent 28%),radial-gradient(circle at 20% 70%,#2e5875cc 0,transparent 40%),linear-gradient(135deg,#07141a,#164354 52%,#080d12)}.card:nth-child(6) .thumb{background:radial-gradient(circle at 70% 22%,#9d78d8bb 0,transparent 30%),radial-gradient(circle at 22% 75%,#315d78cc 0,transparent 42%),linear-gradient(135deg,#0b1020,#27385c 52%,#080b12)}'
          if css_old not in s:
              raise SystemExit('Expected card gradient not found')
          s=s.replace(css_old,css_new,1)
          p.write_text(s)
          PY
      - name: Commit updated portfolio and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add latest Behance projects" || exit 0
          git rm .github/workflows/update-portfolio-work.yml
          git commit -m "Remove temporary portfolio workflow"
          git push
