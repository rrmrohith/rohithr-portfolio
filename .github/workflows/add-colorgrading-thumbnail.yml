name: Add Color Grading thumbnail
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: "!contains(github.event.head_commit.message, '[color-thumb-update]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install thumbnail
        run: |
          python - <<'PY'
          import base64
          data='''56176BASE64PLACEHOLDER'''
          open('assets/color-grading-thumb.webp','wb').write(base64.b64decode(data))
          p='index.html'
          s=open(p,encoding='utf-8').read()
          if 'src="assets/color-grading-thumb.webp"' not in s:
              raise SystemExit('Color Grading card not found')
          open(p,'w',encoding='utf-8').write(s)
          PY
          rm -f .github/workflows/add-colorgrading-thumbnail.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/color-grading-thumb.webp .github/workflows/add-colorgrading-thumbnail.yml
          git commit -m "[color-thumb-update] Update Color Grading portfolio thumbnail"
          git push
