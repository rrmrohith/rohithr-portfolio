name: Fix WhatsApp portfolio icon
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[wa-icon-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix WhatsApp icon
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.find('<a href="https://wa.me/917558017185" target="_blank" aria-label="WhatsApp"><svg')
          if start < 0:
              raise SystemExit('WhatsApp SVG not found')
          end=s.find('</a>',start)+4
          new='<a class="whatsapp" href="https://wa.me/917558017185" target="_blank" aria-label="WhatsApp"><img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp"></a>'
          s=s[:start]+new+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "[wa-icon-fix] Fix WhatsApp contact icon"
          git push
