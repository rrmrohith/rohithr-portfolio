name: Add Some Glimpses thumbnail
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: "!contains(github.event.head_commit.message, '[glimpses-thumb-update]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add thumbnail
        env:
          IMG_B64: ""
        run: |
          echo "$IMG_B64" | base64 -d > assets/glimpses-thumb.webp
          python - <<'PY'
          p='index.html'
          s=open(p,encoding='utf-8').read()
          old='<div class="thumb"><img src="assets/some-glimpses-thumb.webp" alt="Some Glimpses thumbnail"><div class="thumbTitle">CINEMATIC · SHORT-FORM</div></div>'
          new='<div class="thumb"><img src="assets/glimpses-thumb.webp" alt="Some Glimpses thumbnail"><div class="thumbTitle">CINEMATIC · SHORT-FORM</div></div>'
          if old not in s: raise SystemExit('Some Glimpses target not found')
          open(p,'w',encoding='utf-8').write(s.replace(old,new,1))
          PY
          rm -f .github/workflows/add-glimpses-thumbnail-20260916.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/glimpses-thumb.webp .github/workflows/add-glimpses-thumbnail-20260916.yml
          git commit -m "[glimpses-thumb-update] Add Some Glimpses portfolio thumbnail"
          git push
