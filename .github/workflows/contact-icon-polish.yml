name: Polish contact icon fit
on:
  push:
    paths:
      - '.github/workflows/contact-icon-polish.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish app icon fit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='.contact .linkedin svg,.contact .linkedin img{width:46px;height:46px}'
          new='.contact .linkedin svg,.contact .linkedin img{width:46px;height:46px}.contact .instagram img,.contact .behance img,.contact .linkedin img{width:44px;height:44px;border-radius:10px;object-fit:contain}'
          if old in s and '.contact .instagram img,.contact .behance img,.contact .linkedin img{width:44px' not in s:
              s=s.replace(old,new,1)
              p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Polish contact app icon fit' || exit 0
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/contact-icon-polish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary icon polish workflow' || exit 0
          git push