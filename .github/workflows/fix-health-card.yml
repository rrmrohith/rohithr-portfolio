name: Show Health Education thumbnail
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: "!contains(github.event.head_commit.message, '[health-card-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update card
        run: python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); old='<div class=\"thumb\"><div class=\"thumbTitle\">HEALTH · EDUCATION</div></div>'; new='<div class=\"thumb\"><img src=\"assets/health-thumb.webp\" alt=\"Health Education thumbnail\"><div class=\"thumbTitle\">HEALTH · EDUCATION</div></div>'; assert old in s; p.write_text(s.replace(old,new,1))"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "[health-card-fix] Show Health Education thumbnail"
          git push